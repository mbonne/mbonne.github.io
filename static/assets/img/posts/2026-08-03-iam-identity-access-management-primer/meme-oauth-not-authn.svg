<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#282a36"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#44475a" stroke-width="2"/>

  <text x="160" y="40" font-family="monospace" font-size="20" fill="#f1fa8c" text-anchor="middle" font-weight="bold">"JUST USE OAUTH FOR LOGIN"</text>
  <rect x="30" y="60" width="260" height="180" rx="8" fill="#1e1f29" stroke="#bd93f9" stroke-width="2"/>
  <text x="160" y="120" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">access_token: "xyz123"</text>
  <text x="160" y="150" font-family="monospace" font-size="16" fill="#ff5555" text-anchor="middle">who is this user?</text>
  <text x="160" y="180" font-family="monospace" font-size="16" fill="#ff5555" text-anchor="middle">¯\_(ツ)_/¯</text>
  <text x="160" y="220" font-family="monospace" font-size="13" fill="#6272a4" text-anchor="middle">OAuth 2.0 alone: delegated access,</text>
  <text x="160" y="238" font-family="monospace" font-size="13" fill="#6272a4" text-anchor="middle">no identity claim</text>

  <text x="480" y="40" font-family="monospace" font-size="20" fill="#f1fa8c" text-anchor="middle" font-weight="bold">ADD ONE ID TOKEN</text>
  <rect x="350" y="60" width="260" height="180" rx="8" fill="#1e1f29" stroke="#ffb86c" stroke-width="2"/>
  <text x="480" y="120" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">access_token: "xyz123"</text>
  <text x="480" y="150" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">id_token: "eyJhbGci..."</text>
  <text x="480" y="180" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">sub: user-9182, name: ...</text>
  <text x="480" y="220" font-family="monospace" font-size="13" fill="#6272a4" text-anchor="middle">that's OIDC. now you have</text>
  <text x="480" y="238" font-family="monospace" font-size="13" fill="#6272a4" text-anchor="middle">authentication too</text>

  <text x="320" y="300" font-family="monospace" font-size="15" fill="#f8f8f2" text-anchor="middle">OAuth 2.0 answers "what can this token do."</text>
  <text x="320" y="325" font-family="monospace" font-size="15" fill="#f8f8f2" text-anchor="middle">OIDC answers "who is this."</text>
</svg>
