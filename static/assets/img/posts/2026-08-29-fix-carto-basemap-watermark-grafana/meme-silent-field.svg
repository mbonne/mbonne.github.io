<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
  <rect width="600" height="360" fill="#282a36"/>
  <rect x="20" y="20" width="560" height="140" rx="8" fill="#44475a"/>
  <text x="300" y="55" font-family="monospace" font-size="18" fill="#f1fa8c" text-anchor="middle" font-weight="bold">"type": "carto", "config": { "apiKey": "..." }</text>
  <text x="300" y="90" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">me: great, key is set, watermark gone</text>
  <text x="300" y="120" font-family="monospace" font-size="16" fill="#ff5555" text-anchor="middle">grafana: silently ignores unknown field</text>
  <text x="300" y="150" font-family="monospace" font-size="16" fill="#ff5555" text-anchor="middle">watermark: still there, no error anywhere</text>

  <rect x="20" y="200" width="560" height="140" rx="8" fill="#44475a"/>
  <text x="300" y="235" font-family="monospace" font-size="18" fill="#f1fa8c" text-anchor="middle" font-weight="bold">"type": "xyz", "config": { "url": ".../{z}/{x}/{y}.png?key=..." }</text>
  <text x="300" y="270" font-family="monospace" font-size="16" fill="#50fa7b" text-anchor="middle">key is now literally in the tile request</text>
  <text x="300" y="300" font-family="monospace" font-size="16" fill="#bd93f9" text-anchor="middle">watermark: actually gone</text>
  <text x="300" y="330" font-family="monospace" font-size="14" fill="#6272a4" text-anchor="middle">the panel schema has no field for what CARTO's own docs tell you to set</text>
</svg>
